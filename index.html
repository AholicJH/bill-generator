<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>账单详情生成器</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="workspace">
    <!-- 控制栏 -->
    <aside class="control-panel">
      <div class="panel-heading">
        <div>
          <span class="eyebrow">BILL STUDIO</span>
          <h2>账单配置器</h2>
        </div>
        <span class="live-dot" aria-label="实时预览"></span>
      </div>
      <p class="panel-intro">调整下方信息，右侧预览会实时同步。</p>
      <button id="randomBtn" class="btn-primary">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3"/><circle cx="8.5" cy="8.5" r="1" fill="currentColor" stroke="none"/><circle cx="15.5" cy="15.5" r="1" fill="currentColor" stroke="none"/><circle cx="15.5" cy="8.5" r="1" fill="currentColor" stroke="none"/><circle cx="8.5" cy="15.5" r="1" fill="currentColor" stroke="none"/></svg>
        一键随机生成
      </button>
      <button id="saveImageBtn" class="btn-secondary">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v11m0 0 4-4m-4 4-4-4M5 17v1.5A2.5 2.5 0 0 0 7.5 21h9a2.5 2.5 0 0 0 2.5-2.5V17"/></svg>
        保存账单图片
      </button>

      <div class="form-group">
        <label>收款人姓名</label>
        <input type="text" id="inputName" />
      </div>
      <div class="form-group">
        <label>转账金额</label>
        <input type="number" id="inputAmount" step="100" />
      </div>
      <div class="form-group">
        <label>收款银行</label>
        <input type="text" id="inputBank" />
      </div>
      <div class="form-group">
        <label>银行卡后四位</label>
        <input type="text" id="inputCardTail" maxlength="4" />
      </div>
      <div class="form-group">
        <label>对方账户</label>
        <input type="text" id="inputAccount" />
      </div>
      <div class="form-group">
        <label>创建时间</label>
        <input type="text" id="inputTime" />
      </div>
      <div class="form-group">
        <label>订单号</label>
        <input type="text" id="inputOrderId" />
      </div>
    </aside>

    <!-- 手机展示端 -->
    <main class="phone-wrapper">
      <div class="phone-screen">
        <!-- iOS 状态栏 -->
        <header class="status-bar">
          <span class="status-time" id="statusTime">21:02</span>
          <div class="status-icons">
            <svg class="icon-signal" viewBox="0 0 17 12" fill="currentColor">
              <rect x="0" y="8" width="3" height="4" rx="0.5"/>
              <rect x="4.5" y="5.5" width="3" height="6.5" rx="0.5"/>
              <rect x="9" y="3" width="3" height="9" rx="0.5"/>
              <rect x="13.5" y="0" width="3" height="12" rx="0.5"/>
            </svg>
            <svg class="icon-wifi" viewBox="0 0 18 14" aria-hidden="true">
              <path d="M2.1 4.7a10.3 10.3 0 0 1 13.8 0"/>
              <path d="M5 7.7a6.1 6.1 0 0 1 8 0"/>
              <circle cx="9" cy="11.25" r="1.25" class="wifi-dot"/>
            </svg>
            <div class="battery-icon">
              <div class="battery-level"></div>
            </div>
          </div>
        </header>

        <!-- 导航栏 -->
        <nav class="nav-bar">
          <div class="nav-back">
            <svg class="nav-arrow" viewBox="0 0 18 18" aria-hidden="true"><path d="m11.25 3.75-5.25 5.25 5.25 5.25"/></svg>
            <span>返回</span>
          </div>
          <div class="nav-title">账单详情</div>
          <div class="nav-placeholder"></div>
        </nav>

        <!-- 账单核心内容区 -->
        <div class="bill-scroll-content">
          <!-- 头部金额区域 -->
          <section class="bill-header">
            <div class="transfer-caption">转账给</div>
            <div class="payer-name-wrap">
              <span id="displayPayerName">王秋兰</span>
              <span class="arrow-right">›</span>
            </div>
            <div class="amount" id="displayAmount">+200,000.00</div>
            <div class="status-badge"><span class="success-mark">✓</span> 交易成功</div>
          </section>

          <!-- 账目信息分组 1 -->
          <div class="card-group">
            <div class="info-row">
              <span class="row-label">收款方式</span>
              <span class="row-value clickable">
                <span id="displayBankInfo">中信银行(5574)</span>
                <span class="arrow-right">›</span>
              </span>
            </div>
            <div class="info-row">
              <span class="row-label">备注</span>
              <span class="row-value" id="displayRemark">无备注</span>
            </div>
            <div class="info-row">
              <span class="row-label">收款账户</span>
              <span class="row-value" id="displayAccount">王秋兰 Du2***@163.com</span>
            </div>
          </div>

          <!-- 账目信息分组 2 -->
          <div class="card-group">
            <div class="info-row">
              <span class="row-label">交易时间</span>
              <span class="row-value" id="displayTime">2026-10-21 21:02</span>
            </div>
            <div class="info-row">
              <span class="row-label">交易单号</span>
              <span class="row-value" id="displayOrderId">20261021000000008165688723167087</span>
            </div>
          </div>

          <!-- 功能跳转项 3 -->
          <div class="card-group">
            <div class="info-row clickable">
              <span class="row-label-dark">所属分类</span>
              <span class="row-value">
                <span>其他</span>
                <span class="arrow-right">›</span>
              </span>
            </div>
          </div>

          <!-- 功能跳转项 4 -->
          <div class="card-group">
            <div class="info-row clickable">
              <span class="row-label-dark">标签和备注</span>
              <span class="row-value">
                <span>添加</span>
                <span class="arrow-right">›</span>
              </span>
            </div>
            <div class="info-row clickable">
              <span class="row-label-dark">查看往来记录</span>
              <span class="row-value">
                <span class="arrow-right">›</span>
              </span>
            </div>
            <div class="info-row clickable">
              <span class="row-label-dark">申请电子回单</span>
              <span class="row-value">
                <span class="arrow-right">›</span>
              </span>
            </div>
          </div>

          <!-- 功能跳转项 5 -->
          <div class="card-group">
            <div class="info-row clickable">
              <span class="row-label-dark">对此订单有疑问</span>
              <span class="row-value">
                <span class="arrow-right">›</span>
              </span>
            </div>
          </div>
        </div>

        <!-- 底部 Home 虚拟按键条 -->
        <div class="home-indicator-bar">
          <div class="home-indicator"></div>
        </div>
      </div>
    </main>
  </div>

  <div class="image-preview-modal" id="imagePreviewModal" aria-hidden="true">
    <div class="image-preview-backdrop" data-close-preview></div>
    <section class="image-preview-panel" role="dialog" aria-modal="true" aria-label="账单图片预览">
      <div class="image-preview-toolbar">
        <div>
          <strong>账单图片</strong>
          <span>长按图片保存到相册</span>
        </div>
        <button class="preview-close" type="button" data-close-preview aria-label="关闭图片预览">×</button>
      </div>
      <div class="image-preview-content">
        <img id="savedBillImage" alt="生成的账单图片" />
      </div>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
